projects:
  - name: SmartStockAI
    environments:
      - name: Production
        services:
          - type: web
            name: smartstockai-api
            runtime: docker
            region: singapore
            plan: free
            healthCheckPath: /
            dockerfilePath: ./Dockerfile
            dockerContext: .
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: render
              - key: DB_HOST
                fromDatabase:
                  name: smartstockai-db
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: smartstockai-db
                  property: port
              - key: DB_NAME
                fromDatabase:
                  name: smartstockai-db
                  property: database
              - key: DB_USER
                fromDatabase:
                  name: smartstockai-db
                  property: user
              - key: DB_PASSWORD
                fromDatabase:
                  name: smartstockai-db
                  property: password
              - key: JWT_SECRET
                generateValue: true
              - key: CORS_ALLOWED_ORIGINS
                value: https://frontend-three-plum-97.vercel.app
        databases:
          - name: smartstockai-db
            databaseName: smartstockai
            user: smartstock
            plan: free
            region: singapore
            ipAllowList: []